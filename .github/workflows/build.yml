name: Build
on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Build hardened-csi-resizer image
      run: make build-image-csi-resizer

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

    - name: Download VEX report
      shell: bash
      run: |
        set -euo pipefail
        vex_file="$RUNNER_TEMP/rancher.openvex.json"
        curl -fsSL --retry 3 --retry-all-errors --output "${vex_file}.gz" https://github.com/rancher/vexhub/raw/refs/heads/main/reports/rancher.openvex.json.gz
        gzip -d "${vex_file}.gz"
        if [[ -s "${vex_file}" ]]; then
          echo "Using Rancher VEX report"
          echo "TRIVY_VEX=${vex_file}" >> "$GITHUB_ENV"
          echo "TRIVY_SHOW_SUPPRESSED=true" >> "$GITHUB_ENV"
        else
          echo "::warning::Rancher VEX report is unavailable; scanning without VEX"
        fi

    - name: Scan hardened-csi-resizer image for vulnerabilities
      run: make image-scan
